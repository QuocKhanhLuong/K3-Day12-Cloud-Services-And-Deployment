# CP5 — Cấu hình deploy Railway.
#
# Các biến môi trường KHÔNG khai báo ở đây. Đặt chúng trong Railway Variables.
# Railway cung cấp PORT ở runtime. Vì service được deploy bằng Dockerfile,
# startCommand chạy ở exec form nên phải bọc bằng shell để expand $PORT.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "sh -c 'exec uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}'"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
